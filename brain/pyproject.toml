[project]
name = "stream-gateway-brain"
version = "0.1.0"
description = "DeepAgents Brain with tools executed by a task-bound Go Executor"
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepagents==0.7.28",
    "langchain-openai>=1.0,<2",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
